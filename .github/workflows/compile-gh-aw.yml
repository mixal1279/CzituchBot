name: Compile GitHub Agentic Workflows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ai-benchmark-doctor.md"
      - ".github/workflows/ai-benchmark-doctor.lock.yml"
      - ".github/workflows/compile-gh-aw.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ai-benchmark-doctor.md"
      - ".github/workflows/ai-benchmark-doctor.lock.yml"
      - ".github/workflows/compile-gh-aw.yml"

permissions:
  contents: read

concurrency:
  group: compile-gh-aw-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    name: Compile and verify gh-aw workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up GitHub CLI and gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          gh extension install github/gh-aw --pin v0.93.2

      - name: Compile and validate agentic workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw version
          gh aw compile .github/workflows/ai-benchmark-doctor.md

      - name: Apply Copilot Free automatic-selection compatibility patch
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = '.github/workflows/ai-benchmark-doctor.lock.yml';
          const content = fs.readFileSync(path, 'utf8');
          // gh-aw v0.93.2 emits explicit COPILOT_MODEL=auto for both Copilot
          // jobs even when the frontmatter model is the auto sentinel. Copilot
          // Free requires no COPILOT_MODEL value so the CLI can route natively.
          const marker = '          COPILOT_MODEL: auto\n';
          const count = content.split(marker).length - 1;
          if (count !== 2) {
            throw new Error(`Expected two auto model assignments (agent and detection); found ${count}`);
          }
          const patched = content.split(marker).join('');
          if (patched.includes(marker) || !patched.includes('GH_AW_INFO_MODEL: "auto"')) {
            throw new Error('Copilot Free automatic-selection lock validation failed');
          }
          fs.writeFileSync(path, patched);
          process.stdout.write('Removed explicit COPILOT_MODEL from agent and detection jobs.\n');
          NODE

      - name: Upload generated lock file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-benchmark-doctor-lock
          path: .github/workflows/ai-benchmark-doctor.lock.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Verify committed lock file is up to date
        run: |
          git ls-files --error-unmatch .github/workflows/ai-benchmark-doctor.lock.yml
          git diff --exit-code HEAD -- .github/workflows/ai-benchmark-doctor.lock.yml
