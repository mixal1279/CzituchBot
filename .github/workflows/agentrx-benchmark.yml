name: AgentRx benchmark diagnosis

on:
  workflow_run:
    workflows: ["AI live benchmark"]
    types: [completed]
    branches: ["main", "fix/validator-false-rejection-regressions"]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: agentrx-benchmark-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENT_VERIFY_ENDPOINT: ${{ secrets.AGENT_VERIFY_ENDPOINT }}
      AGENT_VERIFY_DEPLOYMENT: ${{ secrets.AGENT_VERIFY_DEPLOYMENT }}
      AGENT_VERIFY_MODEL_NAME: ${{ secrets.AGENT_VERIFY_MODEL_NAME }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Check AgentRx configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$AGENT_VERIFY_ENDPOINT" || -z "$AGENT_VERIFY_DEPLOYMENT" || -z "$AGENT_VERIFY_MODEL_NAME" || -z "$AZURE_CLIENT_ID" || -z "$AZURE_TENANT_ID" || -z "$AZURE_SUBSCRIPTION_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AgentRx skipped. Configure AGENT_VERIFY_ENDPOINT, AGENT_VERIFY_DEPLOYMENT, AGENT_VERIFY_MODEL_NAME, AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID repository secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout benchmark commit
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download benchmark artifact
        if: steps.config.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ai-live-benchmark-${{ github.event.workflow_run.head_sha }}
          path: benchmark-artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AgentRx trajectory inputs
        if: steps.config.outputs.configured == 'true'
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/agentrx-adapter.js benchmark-artifact/ai-live-benchmark.json agentrx-inputs

      - name: Set up Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate to Azure
        if: steps.config.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install AgentRx
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/AgentRx.git /tmp/AgentRx
          python -m pip install --upgrade pip
          python -m pip install -e /tmp/AgentRx

      - name: Run AgentRx diagnosis
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p agentrx-results
          failed=0
          for trajectory in agentrx-inputs/*.json; do
            name="$(basename "$trajectory" .json)"
            echo "::group::AgentRx case $name"
            if python /tmp/AgentRx/run.py "$trajectory" 2>&1 | tee "agentrx-results/$name.log"; then
              :
            else
              failed=1
              echo "::warning::AgentRx failed to diagnose case $name; inspect its log artifact."
            fi
            echo "::endgroup::"
          done
          # Diagnosis is advisory; do not replace the benchmark's own pass/fail result.
          exit 0

      - name: Upload AgentRx report
        if: always() && steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agentrx-diagnosis-${{ github.event.workflow_run.head_sha }}
          path: |
            agentrx-inputs/
            agentrx-results/
            runs/
          if-no-files-found: warn
          retention-days: 14
