name: Deploy CzituchBot to Pterodactyl

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: czituchbot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and upload over SFTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload project files to Pterodactyl
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: "./"
          target: "/home/container"
          overwrite: true
          rm: false
          exclude: ".git/**,.github/**,node_modules/**,.env,.env.*,*firebase-adminsdk*.json,service-account*.json,credentials*.json"
