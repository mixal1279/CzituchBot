name: Deploy CzituchBot to Pterodactyl

# A merge into main creates a push event. Unmerged pull requests never deploy.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: czituchbot-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and upload over SFTP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Add SFTP server host key
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          set -euo pipefail
          test -n "$SFTP_HOST"
          test -n "$SFTP_PORT"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$SFTP_PORT" -H "$SFTP_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare deployment package
        run: |
          set -euo pipefail
          DEPLOY_DIR="$RUNNER_TEMP/czituchbot-deploy"
          mkdir -p "$DEPLOY_DIR"

          # Export only Git-tracked files; never mirror the runner's working tree.
          git archive --format=tar HEAD | tar -xf - -C "$DEPLOY_DIR"

          # Remove development-only directories at every depth, not just at repository root.
          find "$DEPLOY_DIR" -type d \
            \( -name '.git' -o -name '.github' -o -name 'test' -o -name 'tests' \
               -o -name '__tests__' -o -name 'coverage' -o -name '.nyc_output' \
               -o -name 'scripts' -o -name 'docs' -o -name 'node_modules' \) \
            -prune -exec rm -rf {} +

          # Fail the deployment if any Git/test/development directory survived packaging.
          if find "$DEPLOY_DIR" -type d \
            \( -name '.git' -o -name '.github' -o -name 'test' -o -name 'tests' \
               -o -name '__tests__' -o -name 'coverage' -o -name '.nyc_output' \
               -o -name 'node_modules' \) -print -quit | grep -q .; then
            echo "ERROR: development/test directory found in deployment package."
            exit 1
          fi

          # Keep local secrets and runtime state off the hosting account.
          find "$DEPLOY_DIR" -type f \
            \( -name '.env' -o -name '.env.*' \
            -o -name '*firebase-adminsdk*.json' \
            -o -name 'service-account*.json' \
            -o -name 'credentials*.json' \
            -o -name 'ai_verified_memory.json' \
            -o -name 'tavily_cache.json' \
            -o -name 'tavily_cache.json.tmp-*' \) -delete

          echo "Deployment package prepared:"
          du -sh "$DEPLOY_DIR"
          find "$DEPLOY_DIR" -type f | wc -l | xargs echo "Files to upload:"

      - name: Upload deployment package over SFTP
        timeout-minutes: 14
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SFTP_HOST"
          test -n "$SFTP_PORT"
          test -n "$SFTP_USERNAME"
          test -n "$SFTP_PASSWORD"

          DEPLOY_DIR="$RUNNER_TEMP/czituchbot-deploy"
          echo "Starting SFTP upload from prepared package..."

          timeout --signal=TERM --kill-after=30s 12m \
            env LFTP_PASSWORD="$SFTP_PASSWORD" lftp --env-password \
              -u "$SFTP_USERNAME" \
              "sftp://$SFTP_HOST:$SFTP_PORT" \
              -e "
                set cmd:fail-exit yes;
                set net:timeout 15;
                set net:max-retries 1;
                set net:reconnect-interval-base 2;
                set sftp:auto-confirm yes;
                # Remove stale development directories left by previous deployments.
                # Do not use mirror --delete: runtime data and server-side files must be preserved.
                set cmd:fail-exit no;
                rm -r .github;
                rm -r .git;
                rm -r test;
                rm -r tests;
                rm -r __tests__;
                rm -r coverage;
                rm -r .nyc_output;
                rm -r scripts;
                rm -r docs;
                set cmd:fail-exit yes;
                lcd $DEPLOY_DIR;
                mirror --reverse --verbose --parallel=2 ./ ./;
                bye
              "

          echo "SFTP upload completed successfully."
