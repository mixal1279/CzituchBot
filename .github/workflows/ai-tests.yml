name: AI regression tests

on:
  push:
    paths:
      - 'ai/**'
      - 'test/**'
      - 'package.json'
      - 'czituch_bot.js'
      - '.github/workflows/ai-tests.yml'
  pull_request:
    paths:
      - 'ai/**'
      - 'test/**'
      - 'package.json'
      - 'czituch_bot.js'
      - '.github/workflows/ai-tests.yml'

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run AI regression tests
        run: node --test test

      - name: Syntax check AI modules
        run: |
          node --check ai/entities.js
          node --check ai/planner.js
          node --check ai/router.js
          node --check ai/lore.js
          node --check ai/gameplay.js
          node --check ai/policy.js
          node --check ai/response.js
          node --check ai/validator.js
          node --check ai/tavily.js
          node --check czituch_bot.js

      - name: Prepare changed-files artifact
        shell: bash
        run: |
          set -euo pipefail

          HEAD_SHA="${{ github.sha }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          rm -rf artifact
          mkdir -p artifact

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git ls-tree -r --name-only "$HEAD_SHA" > /tmp/changed-files.txt
          else
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          fi

          git diff --name-only --diff-filter=D "$BASE_SHA" "$HEAD_SHA" > artifact/deleted-files.txt 2>/dev/null || true

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              .env|.env.*|*token.json|credentials*.json|service-account*.json)
                echo "Skipping sensitive-looking file: $file"
                continue
                ;;
            esac

            if [[ -f "$file" ]]; then
              mkdir -p "artifact/$(dirname "$file")"
              cp -- "$file" "artifact/$file"
            fi
          done < /tmp/changed-files.txt

          printf 'commit=%s\nbase=%s\nevent=%s\n' "$HEAD_SHA" "$BASE_SHA" "${{ github.event_name }}" > artifact/build-info.txt

      - name: Upload changed-files artifact
        uses: actions/upload-artifact@v4
        with:
          name: changed-files-${{ github.sha }}
          path: artifact/
          if-no-files-found: warn
          retention-days: 14
