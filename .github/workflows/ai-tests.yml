name: AI regression tests

on:
  push:
    paths:
      - 'ai/**'
      - 'test/**'
      - 'package.json'
      - 'czituch_bot.js'
      - 'trello.js'
      - '.github/workflows/ai-tests.yml'
  pull_request:
    paths:
      - 'ai/**'
      - 'test/**'
      - 'package.json'
      - 'czituch_bot.js'
      - '.github/workflows/ai-tests.yml'

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run AI regression tests
        run: |
          npm install
          npm test

      - name: Syntax check AI modules
        run: |
          node --check test/ai.adversarial.test.js
          node --check ai/entities.js
          node --check ai/planner.js
          node --check ai/router.js
          node --check ai/lore.js
          node --check ai/gameplay.js
          node --check ai/policy.js
          node --check ai/response.js
          node --check ai/validator.js
          node --check ai/tavily.js
          node --check ai/webRetrieval.js
          node --check czituch_bot.js
          node --check trello.js
