name: xKiro validator A/B benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xkiro-validator-ab-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      XKIRO_AB_REPORT: xkiro-validator-ab-report.json
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v6
        with:
          ref: audit/full-bot-hardening
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run isolated xKiro A/B benchmark
        run: npm run ai:benchmark:xkiro-ab
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xkiro-validator-ab-${{ github.run_id }}
          path: xkiro-validator-ab-report.json
          if-no-files-found: warn
          retention-days: 14
