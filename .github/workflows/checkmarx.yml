name: Checkmarx One

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "33 18 * * 0"

permissions:
  contents: read

jobs:
  scan:
    name: Checkmarx One AST scan
    runs-on: ubuntu-latest
    # Secrets are not exposed to forked pull requests. Skip those scans rather than
    # failing authentication or risking credential exposure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Checkmarx configuration
        env:
          CX_BASE_URI: ${{ secrets.CX_BASE_URI }}
          CX_TENANT: ${{ secrets.CX_TENANT }}
          CX_CLIENT_ID: ${{ secrets.CX_CLIENT_ID }}
          CX_CLIENT_SECRET: ${{ secrets.CX_CLIENT_SECRET }}
        shell: bash
        run: |
          missing=0
          for name in CX_BASE_URI CX_TENANT CX_CLIENT_ID CX_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the required Checkmarx One secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run Checkmarx One scan
        uses: Checkmarx/ast-github-action@7006afa846f6d23e3e9d351a001b9d8e59c3fb8c
        with:
          base_uri: ${{ secrets.CX_BASE_URI }}
          cx_tenant: ${{ secrets.CX_TENANT }}
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          project_name: ${{ github.repository }}
          branch: ${{ github.head_ref || github.ref_name }}
          github_token: ${{ github.token }}
          scan_params: --report-format sarif --output-path .
          repo_name: ${{ github.event.repository.name }}
          namespace: ${{ github.repository_owner }}

      - name: Upload Checkmarx SARIF results
        if: always() && hashFiles('cx_result.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cx_result.sarif
          category: checkmarx
