# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow integrates njsscan with GitHub's Code Scanning feature
# nodejsscan is a static security code scanner that finds insecure code patterns in your Node.js applications

name: njsscan sarif

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '33 8 * * 4'

permissions:
  contents: read

jobs:
  njsscan:
    timeout-minutes: 15
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    name: njsscan code scanning
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: nodejsscan scan (SARIF)
      id: njsscan
      uses: ajinabraham/njsscan-action@7237412fdd36af517e2745077cedbf9d6900d711
      with:
        args: '. --sarif --output results.sarif || true'
    - name: Generate njsscan JSON report
      id: njsscan-json
      uses: ajinabraham/njsscan-action@7237412fdd36af517e2745077cedbf9d6900d711
      with:
        args: '. --json --output njsscan-report.json || true'
    - name: Validate njsscan JSON report
      if: always()
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const file = 'njsscan-report.json';
        if (!fs.existsSync(file)) throw new Error('njsscan JSON report is missing');
        const report = JSON.parse(fs.readFileSync(file, 'utf8'));
        if (!report || typeof report !== 'object' || !report.nodejs || typeof report.nodejs !== 'object') {
          throw new Error('njsscan JSON report has an unexpected schema');
        }
        const errors = Array.isArray(report.errors) ? report.errors : [];
        if (errors.length) {
          const summary = errors.map(error => `${error.rule_id || 'unknown'}:${error.type || 'error'}`).join(', ');
          throw new Error(`njsscan analysis incomplete: ${errors.length} scanner error(s): ${summary}`);
        }
        console.log('njsscan JSON report validated; no scanner errors or timeouts.');
        NODE
    - name: Upload njsscan JSON artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: njsscan-json-report
        path: njsscan-report.json
        if-no-files-found: warn
        retention-days: 30
    - name: Upload njsscan SARIF report
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
