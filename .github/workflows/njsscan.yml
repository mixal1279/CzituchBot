name: njsscan sarif

on:
  push:
    branches: [ main, audit/full-bot-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  njsscan:
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    name: njsscan code scanning
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install current njsscan
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install njsscan==1.0.2

      - name: Run njsscan once and generate JSON + SARIF
        id: njsscan
        continue-on-error: true
        run: |
          python <<'PY'
          import sys
          from njsscan import __version__
          from njsscan.njsscan import NJSScan
          from njsscan.formatters.json_out import json_output
          from njsscan.formatters.sarif import sarif_output

          results = NJSScan(['.'], True, False).scan()
          json_output('njsscan-report.json', results, __version__)
          sarif_output('results.sarif', results, __version__)

          errors = results.get('errors') or []
          print(f"njsscan {__version__}: {len(errors)} scanner error(s)")
          for error in errors:
              print(f"{error.get('type', 'error')}: {error.get('message', 'no details')}")
          if errors:
              sys.exit(1)
          PY

      - name: Validate njsscan JSON report
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'njsscan-report.json';
          if (!fs.existsSync(file)) throw new Error('njsscan JSON report is missing');
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (report.njsscan_version !== '1.0.2') throw new Error('Unexpected njsscan version in report');
          if (!report.nodejs || typeof report.nodejs !== 'object'
              || !report.templates || typeof report.templates !== 'object') {
            throw new Error('njsscan JSON report has an unexpected schema');
          }
          const errors = Array.isArray(report.errors) ? report.errors : [];
          const count = Object.values({ ...report.nodejs, ...report.templates })
            .reduce((sum, rule) => sum + (Array.isArray(rule.files) ? rule.files.length : 0), 0);
          console.log(`njsscan findings: ${count}; scanner errors: ${errors.length}`);
          if (errors.length) {
            const summary = errors.map(error => `${error.type || 'error'}`).join(', ');
            throw new Error(`njsscan analysis incomplete: ${errors.length} scanner error(s): ${summary}`);
          }
          NODE

      - name: Upload njsscan JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: njsscan-json-report
          path: njsscan-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload njsscan SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
