# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow integrates njsscan with GitHub's Code Scanning feature
# nodejsscan is a static security code scanner that finds insecure code patterns in your Node.js applications

name: njsscan sarif

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '33 8 * * 4'

permissions:
  contents: read

jobs:
  njsscan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    name: njsscan code scanning
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: nodejsscan scan
      id: njsscan
      uses: ajinabraham/njsscan-action@7237412fdd36af517e2745077cedbf9d6900d711
      with:
        args: '. --sarif --output results.sarif || true'
    - name: Upload njsscan report
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
    - name: Set up Python for JSON report
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Generate and validate njsscan JSON report
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check njsscan==0.4.3
        set +e
        njsscan --json --output njsscan-report.json .
        scan_status=$?
        set -e
        if [[ ! -s njsscan-report.json ]]; then
          echo "::error::njsscan did not produce a JSON report (exit code: $scan_status)"
          exit 1
        fi
        NJSSCAN_EXIT_CODE="$scan_status" python - <<'PY'
        import json
        import os
        from pathlib import Path
        report = json.loads(Path('njsscan-report.json').read_text(encoding='utf-8'))
        errors = report.get('errors', [])
        nodejs = report.get('nodejs', {})
        findings = sum(len(rule.get('files', [])) for rule in nodejs.values())
        print(f"njsscan JSON valid; findings={findings}; scanner_errors={len(errors)}")
        with open('njsscan-summary.txt', 'w', encoding='utf-8') as output:
            output.write(f"findings={findings}\\nscanner_errors={len(errors)}\\nexit_code={os.environ['NJSSCAN_EXIT_CODE']}\\n")
        PY
    - name: Upload njsscan JSON artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: njsscan-json-report
        path: |
          njsscan-report.json
          njsscan-summary.txt
        if-no-files-found: error
        retention-days: 14
