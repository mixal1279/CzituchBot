name: njsscan sarif

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: njsscan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  njsscan:
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    name: njsscan code scanning
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install current njsscan
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install njsscan==1.0.2

      - name: Set Semgrep timeout for large source files
        run: |
          real_semgrep="$(command -v semgrep)"
          test -x "$real_semgrep"
          mkdir -p "$RUNNER_TEMP/njsscan-bin"
          cat > "$RUNNER_TEMP/njsscan-bin/semgrep" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          args=("$@")
          for i in "${!args[@]}"; do
            if [[ "${args[$i]}" == "--" ]]; then
              before=("${args[@]:0:i}")
              after=("${args[@]:i+1}")
              exec "$NJSSCAN_SEMGREP_BIN" "${before[@]}" --timeout 300 -- "${after[@]}"
            fi
          done
          exec "$NJSSCAN_SEMGREP_BIN" "$@" --timeout 300
          SH
          chmod +x "$RUNNER_TEMP/njsscan-bin/semgrep"
          echo "NJSSCAN_SEMGREP_BIN=$real_semgrep" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/njsscan-bin" >> "$GITHUB_PATH"

      - name: Run njsscan once and generate JSON + SARIF
        id: njsscan
        continue-on-error: true
        run: |
          python <<'PY'
          import sys
          from njsscan import __version__
          from njsscan.njsscan import NJSScan
          from njsscan.formatters.json_out import json_output
          from njsscan.formatters.sarif import sarif_output

          results = NJSScan(['.'], True, False).scan()
          json_output('njsscan-report.json', results, __version__)
          sarif_output('results.sarif', results, __version__)

          errors = results.get('errors') or []
          print(f"njsscan {__version__}: {len(errors)} scanner error(s)")
          for error in errors:
              print(f"{error.get('type', 'error')}: {error.get('message', 'no details')}")
          if errors:
              sys.exit(1)
          PY

      - name: Validate njsscan JSON report
        id: validate_njsscan
        if: always()
        env:
          NJSSCAN_OUTCOME: ${{ steps.njsscan.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (process.env.NJSSCAN_OUTCOME !== 'success') {
            throw new Error(`njsscan did not complete successfully (outcome=${process.env.NJSSCAN_OUTCOME || 'unknown'})`);
          }
          const file = 'njsscan-report.json';
          if (!fs.existsSync(file)) throw new Error('njsscan JSON report is missing');
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (report.njsscan_version !== '1.0.2') throw new Error('Unexpected njsscan version in report');
          if (!report.nodejs || typeof report.nodejs !== 'object'
              || !report.templates || typeof report.templates !== 'object') {
            throw new Error('njsscan JSON report has an unexpected schema');
          }
          if (!Array.isArray(report.errors)) throw new Error('njsscan report is missing scanner error metadata');
          const errors = report.errors;
          const allRules = { ...report.nodejs, ...report.templates };
          const counts = Object.entries(allRules)
            .map(([name, rule]) => [name, Array.isArray(rule.files) ? rule.files.length : 0])
            .filter(([, count]) => count > 0)
            .sort((a, b) => b[1] - a[1]);
          const count = counts.reduce((sum, [, value]) => sum + value, 0);
          console.log(`njsscan findings: ${count}; scanner errors: ${errors.length}`);
          const summary = [
            '## njsscan',
            `- Findings: ${count}`,
            `- Scanner errors: ${errors.length}`,
            ...counts.map(([name, value]) => `- ${name}: ${value}`),
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          if (errors.length) {
            const summary = errors.map(error => `${error.type || 'error'}`).join(', ');
            throw new Error(`njsscan analysis incomplete: ${errors.length} scanner error(s): ${summary}`);
          }
          const sarifFile = 'results.sarif';
          if (!fs.existsSync(sarifFile)) throw new Error('njsscan SARIF report is missing');
          const sarif = JSON.parse(fs.readFileSync(sarifFile, 'utf8'));
          if (!Array.isArray(sarif.runs) || sarif.runs.length === 0) throw new Error('njsscan SARIF report has no analysis runs');
          NODE

      - name: Upload njsscan JSON artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: njsscan-json-report
          path: njsscan-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload njsscan SARIF report
        if: steps.njsscan.outcome == 'success' && steps.validate_njsscan.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
