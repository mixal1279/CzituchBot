name: AI live benchmark

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Ziarno rotacji przypadków (0 = stały zestaw, >0 = inne pytania z każdej kategorii)'
        required: false
        default: '0'
  # Benchmark uruchamiamy wyłącznie ręcznie (workflow_dispatch), żeby zwykły push
  # nie zużywał limitów API ani nie uruchamiał kosztownych testów live.

concurrency:
  group: ai-live-benchmark-current
  # A newer commit must benchmark the current code, not wait behind a stale run.
  cancel-in-progress: true

jobs:
  live-benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AI_LIVE_BENCHMARK: "1"
      AI_BENCHMARK_LIMIT: "5"
      AI_BENCHMARK_DELAY_MS: "5000"
      AI_BENCHMARK_SEED: ${{ inputs.seed || '0' }}
      AI_BENCHMARK_REQUIRE_PERFECT: "1"
      AI_BENCHMARK_JSON_PATH: ai-live-benchmark.json
      AI_PROVIDER_QUOTA_COOLDOWN_MS: "1800000"
      AI_120B_GLOBAL_MAX_REQUESTS: "20"
      CZITUCHBOT_SKIP_STARTUP_IO: "1"
      # Osobny klucz CI chroni dzienny limit tokenów produkcyjnego bota (jeśli secret istnieje).
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_CI || secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      XKIRO_MODEL: "qwen/qwen3.5-397b-a17b:free"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Sanity check xKiro
        shell: bash
        run: |
          set -uo pipefail

          if [[ -z "${XKIRO_API_KEY:-}" ]]; then
            echo "XKIRO_SECRET_MISSING: GitHub Actions secret XKIRO_API_KEY is empty or unavailable."
            exit 1
          fi

          http_code="$(curl --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --output /tmp/xkiro-response.json \
            --write-out "%{http_code}" \
            --request POST "https://api.xkiro.com/v1/chat/completions" \
            --header "Authorization: Bearer ${XKIRO_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"model":"qwen/qwen3.5-397b-a17b:free","messages":[{"role":"user","content":"Reply with exactly: OK"}],"max_tokens":8,"temperature":0}' \
          )" || http_code="000"

          echo "XKIRO_HTTP_STATUS=${http_code}"
          if [[ -f /tmp/xkiro-response.json ]]; then
            cat /tmp/xkiro-response.json
            echo
          fi

          if [[ "${http_code}" != "200" ]]; then
            if [[ "${http_code}" == "000" ]]; then
              echo "DIAGNOSIS=XKIRO_CONNECTION_TIMEOUT_OR_NETWORK_ERROR"
            elif [[ "${http_code}" == "401" || "${http_code}" == "403" ]]; then
              echo "DIAGNOSIS=XKIRO_AUTH_OR_ACCESS_REJECTED"
            elif [[ "${http_code}" == "429" ]]; then
              echo "DIAGNOSIS=XKIRO_RATE_LIMIT_OR_QUOTA"
            else
              echo "DIAGNOSIS=XKIRO_API_ERROR"
            fi
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          try:
              data = json.loads(Path("/tmp/xkiro-response.json").read_text())
              content = data["choices"][0]["message"]["content"]
              if isinstance(content, list):
                  content = "".join(
                      part if isinstance(part, str) else part.get("text", "")
                      for part in content
                  )
              if not isinstance(content, str) or not content.strip():
                  raise ValueError("empty message content")
              print("XKIRO_SANITY_CHECK=PASS")
              print("XKIRO_RESPONSE_CONTENT=" + content[:200])
          except Exception as exc:
              print("XKIRO_SANITY_CHECK=FAIL")
              print("DIAGNOSIS=XKIRO_HTTP_200_WITH_INVALID_OR_EMPTY_RESPONSE")
              print("DETAIL=" + type(exc).__name__ + ": " + str(exc))
              raise SystemExit(1)
          PY

      - name: Install dependencies
        run: npm install

      - name: Preflight Tavily
        run: node scripts/tavily-preflight.js
      - name: Preflight Groq
        run: node scripts/groq-preflight.js

      - name: Run 5-case live benchmark
        shell: bash
        run: |
          set -o pipefail
          npm run ai:benchmark:live 2>&1 | tee ai-live-benchmark-report.txt

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("ai-live-benchmark.json")) { console.log("Brak raportu JSON."); process.exit(0); }
            const r = JSON.parse(fs.readFileSync("ai-live-benchmark.json", "utf8"));
            const d = r.diagnostics || {};
            const lines = [
              "## AI live benchmark",
              r.valid === false ? "**WYNIK NIEWAŻNY: Groq niedostępny lub limit dzienny wyczerpany.**" : "",
              "- przypadków: " + r.total + " (ziarno " + (r.seed || 0) + ")",
              "- odpowiedzi: " + r.answeredAccuracy + ", kompletność: " + r.completenessAccuracy + ", factual: " + r.factualAccuracy,
              "- błędy providerów: " + ((d.providerFailures || []).join(", ") || "brak"),
              "- odrzucone przez walidator: " + d.validatorRejected + ", niejednoznaczne: " + d.validatorInconclusive,
              "",
              "| przypadek | odpowiedź | judge | status końcowy |",
              "|---|---|---|---|",
              ...(r.failures || []).map(f => "| " + f.id + " | " + f.answered + " | " + f.judgeStatus + " | " + f.finalStatus + " |"),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.filter(l => l !== undefined).join("\n") + "\n");
          '

      - name: Upload benchmark report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ai-live-benchmark-${{ github.sha }}
          path: |
            ai-live-benchmark-report.txt
            ai-live-benchmark.json
          if-no-files-found: warn
          retention-days: 7
