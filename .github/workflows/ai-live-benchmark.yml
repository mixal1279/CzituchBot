name: AI live benchmark

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Ziarno rotacji przypadków (0 = stały zestaw, >0 = inne pytania z każdej kategorii)'
        required: false
        default: '0'
  # Benchmark uruchamiamy wyłącznie ręcznie (workflow_dispatch), żeby zwykły push
  # nie zużywał limitów API ani nie uruchamiał kosztownych testów live.

permissions:
  contents: read

concurrency:
  group: ai-live-benchmark-current
  # A newer commit must benchmark the current code, not wait behind a stale run.
  cancel-in-progress: false

jobs:
  live-benchmark:
    if: github.event_name == 'workflow_dispatch'
    name: Live benchmark (Cohere Command A Reasoning generator + validator)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AI_LIVE_BENCHMARK: "1"
      AI_ALLOW_PARTIAL_ANSWERS: "1"
      AI_BENCHMARK_LIMIT: "17"
      AI_BENCHMARK_DELAY_MS: "5000"
      AI_REQUEST_TIMEOUT_MS: "85000"
      AI_XKIRO_GENERATOR_TIMEOUT_MS: "30000"
      AI_XKIRO_GENERATOR_MAX_TOKENS: "700"
      AI_XKIRO_VALIDATOR_TIMEOUT_MS: "22000"
      AI_OPENROUTER_VALIDATOR_TIMEOUT_MS: "6000"
      AI_GENERATOR_PROVIDER: "xkiro"
      AI_BENCHMARK_STRICT_GENERATOR: "1"
      AI_VALIDATOR_GEMINI: "0"
      AI_BENCHMARK_SEED: ${{ inputs.seed || '0' }}
      AI_BENCHMARK_REQUIRE_PERFECT: "1"
      AI_BENCHMARK_JSON_PATH: ai-live-benchmark.json
      AI_PROVIDER_QUOTA_COOLDOWN_MS: "1800000"
      AI_120B_GLOBAL_MAX_REQUESTS: "20"
      CZITUCHBOT_SKIP_STARTUP_IO: "1"
      # Osobny klucz CI chroni dzienny limit tokenów produkcyjnego bota (jeśli secret istnieje).
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_CI || secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      XKIRO_MODEL: cohere/command-a-reasoning
      XKIRO_VALIDATOR_MODEL: cohere/command-a-reasoning
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
      - name: Run offline benchmark (no API calls)
        run: npm run benchmark:offline
      - name: Syntax check live benchmark modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find ai -maxdepth 1 -type f -name '*.js' -print0)
          node --check scripts/validator-providers-preflight.js
          node --check scripts/groq-preflight.js
          node --check scripts/ai-live-benchmark.js
          node --check czituch_bot.js

      - name: Preflight Tavily
        run: node scripts/tavily-preflight.js
      - name: Preflight Groq
        run: node scripts/groq-preflight.js
      - name: Preflight validator providers
        id: validator-preflight
        env:
          PREFLIGHT_STRICT: "1"
          PREFLIGHT_TIMEOUT_MS: "25000"
        run: node scripts/validator-providers-preflight.js

      - name: Run 17-case live benchmark
        id: live-benchmark
        shell: bash
        run: |
          set -o pipefail
          npm run ai:benchmark:live 2>&1 | tee ai-live-benchmark-report.txt

      # A strict preflight can stop the job before the benchmark command creates
      # its tee output. Always leave a downloadable diagnostic report in that case.
      - name: Ensure benchmark diagnostic report exists
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.validator-preflight.outcome || 'skipped' }}
          BENCHMARK_OUTCOME: ${{ steps.live-benchmark.outcome || 'skipped' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = 'ai-live-benchmark-report.txt';
          if (!fs.existsSync(report)) {
            const lines = [
              '# AI live benchmark — diagnostyka',
              '',
              'Benchmark nie wygenerował raportu JSON.',
              `Preflight walidatorów: ${process.env.PREFLIGHT_OUTCOME || 'unknown'}`,
              `Uruchomienie benchmarku: ${process.env.BENCHMARK_OUTCOME || 'unknown'}`,
              '',
              'Sprawdź logi kroków preflight i konfigurację sekretów GitHub Actions.',
            ];
            fs.writeFileSync(report, lines.join('\n') + '\n', { encoding: 'utf8', flag: 'wx' });
          }
          NODE

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("ai-live-benchmark.json")) { console.log("Brak raportu JSON."); process.exit(0); }
            const r = JSON.parse(fs.readFileSync("ai-live-benchmark.json", "utf8"));
            const d = r.diagnostics || {};
            const lines = [
              "## AI live benchmark — generator: " + process.env.AI_GENERATOR_PROVIDER + "/" + process.env.XKIRO_MODEL,
              r.valid === false ? "**WYNIK NIEWAŻNY / NIEPORÓWNYWALNY: " + [...(d.outageProviders || []).map(x => "outage=" + x), ...(d.qualityDegradationReasons || [])].join(", ").replace(/^$/, "niewystarczająca dostępność providerów") + ".**" : "",
              "- przypadków: " + r.total + " (ziarno " + (r.seed || 0) + ")",
              "- odpowiedzi: " + r.answeredAccuracy + ", kompletność: " + r.completenessAccuracy + ", factual: " + r.factualAccuracy,
              "- claim-source support: ścisłe=" + r.claimSupportPassRate + ", użyteczne=" + r.claimSupportUsableRate,
              "- retrieval trace: przypadki=" + ((r.retrievalTraceSummary || {}).casesWithTrace || 0) + ", średnie zapytania=" + ((r.retrievalTraceSummary || {}).averageQueryCount ?? "n/a") + ", średnie źródła=" + ((r.retrievalTraceSummary || {}).averageCandidateCount ?? "n/a") + ", średnie hosty=" + ((r.retrievalTraceSummary || {}).averageSelectedHostCount ?? "n/a") + ", providerzy=" + JSON.stringify((r.retrievalTraceSummary || {}).providerCounts || {}) + ", semantic rerank=" + ((r.retrievalTraceSummary || {}).semanticRerankingCases || 0),
              "- Exa semantic retrieval: przypadki=" + ((r.retrievalTraceSummary || {}).semanticSearchCases || 0),
              "- claim-source werdykty: " + Object.entries((r.claimSupport || {}).claimSourceVerdictCounts || {}).map(([k, v]) => k + "=" + v).join(", "),
              "- błędy generatora: " + ((d.generationProviderFailures || []).join(", ") || "brak"),
              "- dostawcy zdegradowani: " + ((d.degradedProviders || []).join(", ") || "brak"),
              "- transport walidatora: " + ((d.validatorTransportFailures || []).map(x => [x.provider, x.model, x.status, x.statusCode ? "HTTP " + x.statusCode : "", x.reason || ""].filter(Boolean).join("/")).join("; ") || "brak"),
              "- Tavily HTTP: " + (d.tavilyHttpCalls || 0) + " wywołań, błędy=" + (d.tavilyHttpFailures || 0) + " (" + (d.tavilyHttpFailureRate ?? 0) + "), statusy=" + (Object.entries(d.tavilyHttpFailuresByStatus || {}).map(([k, v]) => k + "=" + v).join(", ") || "brak"),
              "- porównywalność jakości: " + (d.qualityComparable ? "tak" : "nie — metryki ograniczone przez dostawców"),
              "- ograniczenia jakości: " + ((d.qualityDegradationReasons || []).join(", ") || "brak"),
              "- odrzucone przez walidator: " + d.validatorRejected + ", niejednoznaczne: " + d.validatorInconclusive,
              "- odrzucone odpowiedzi zaakceptowane przez judge: " + (r.discardedJudgeAcceptedCount || 0) + " (" + ((r.discardedJudgeAcceptedCaseIds || []).join(", ") || "brak") + "), z poprawnymi gold facts: " + (r.discardedJudgeAcceptedFactualPassedCount || 0),
              "- blokady bezpieczeństwa Gemini: " + (d.validatorSafetyBlocks || 0),
              "- wywołania walidatora: " + d.validatorCalls + ", pominięte: " + (d.validatorSkipped || 0) + ", niedostępne: " + d.validatorUnavailable,
              "- Cohere primary: wywołania=" + (d.xkiroValidatorCalls || 0) + ", werdykty=" + (d.xkiroValidatorVerdictCalls || 0),
              "- klasy wyników: " + Object.entries(d.outcomeCounts || {}).map(([k, v]) => k + "=" + v).join(", "),
              "",
              "| przypadek | odpowiedź | judge | status końcowy |",
              "|---|---|---|---|",
              ...(r.failures || []).map(f => "| " + f.id + " | " + f.answered + " | " + f.judgeStatus + " | " + f.finalStatus + " |"),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.filter(l => l !== undefined).join("\n") + "\n");
          '

      - name: Upload benchmark report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-live-benchmark-cohere-${{ github.sha }}
          path: |
            ai-live-benchmark-report.txt
            ai-live-benchmark.json
          if-no-files-found: warn
          retention-days: 7
