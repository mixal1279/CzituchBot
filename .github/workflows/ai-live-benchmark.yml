name: AI live benchmark

on:
  workflow_dispatch:

concurrency:
  group: ai-live-benchmark
  cancel-in-progress: false

jobs:
  live-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AI_LIVE_BENCHMARK: "1"
      AI_BENCHMARK_LIMIT: "10"
      AI_BENCHMARK_DELAY_MS: "750"
      AI_BENCHMARK_REQUIRE_PERFECT: "1"
      AI_PROVIDER_QUOTA_COOLDOWN_MS: "1800000"
      AI_120B_GLOBAL_MAX_REQUESTS: "5"
      CZITUCHBOT_SKIP_STARTUP_IO: "1"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      XKIRO_MODEL: "qwen/qwen3.5-397b-a17b:free"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run 10-case live benchmark
        shell: bash
        run: |
          set -o pipefail
          npm run ai:benchmark:live 2>&1 | tee ai-live-benchmark-report.txt

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-live-benchmark-${{ github.sha }}
          path: ai-live-benchmark-report.txt
          if-no-files-found: warn
          retention-days: 14
